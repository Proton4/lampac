name: Mirror Crosswalk-compatible Lampa plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-crosswalk-plugins.yml"
      - "scripts/build-crosswalk-plugins.py"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build compatible plugin files
        run: python3 scripts/build-crosswalk-plugins.py

      - name: Validate generated files
        run: |
          set -euo pipefail
          test -s nightingale-xwalk5.js
          test -s tsTracksProbe.js
          grep -Fq "Promise.prototype['finally']" nightingale-xwalk5.js
          grep -Fq "TS Tracks Probe" tsTracksProbe.js

      - name: Commit generated files when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightingale-xwalk5.js tsTracksProbe.js
          if git diff --cached --quiet; then
            echo "Generated plugin files are already current"
          else
            git commit -m "Mirror Crosswalk-compatible Lampa plugins"
            git push
          fi
