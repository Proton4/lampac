name: Mirror TS Tracks Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-crosswalk-plugins.yml"
      - "scripts/build-crosswalk-plugins.py"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mirrored plugin file
        run: python3 scripts/build-crosswalk-plugins.py

      - name: Validate generated file
        run: |
          set -euo pipefail
          test -s tsTracksProbe.js
          grep -Fq "TS Tracks Probe" tsTracksProbe.js

      - name: Commit generated file when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsTracksProbe.js
          if git diff --cached --quiet; then
            echo "tsTracksProbe.js is already current"
          else
            git commit -m "Mirror TS Tracks Probe"
            git push
          fi
